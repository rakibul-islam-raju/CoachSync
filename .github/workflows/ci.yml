name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: coaching_management_test
          POSTGRES_USER: coachsync
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coachsync -d coaching_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "False"
      ENVIRONMENT: production
      SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-000000
      DATABASE_ENGINE: postgresql
      PG_DB: coaching_management_test
      PG_USER: coachsync
      PG_PASSWORD: test-password
      PG_HOST: 127.0.0.1
      PG_PORT: "5432"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOW_ALL_ORIGINS: "False"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      PAGE_SIZE: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Django system and migration checks
        env:
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          SECURE_HSTS_PRELOAD: "True"
          TRUST_PROXY_HEADERS: "True"
        run: |
          uv run python manage.py check --deploy --fail-level WARNING
          uv run python manage.py makemigrations --check --dry-run
      - name: Apply migrations and audit data
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py audit_data_integrity --fail-on-error
      - name: Run backend tests
        run: uv run python manage.py test
      - name: Validate OpenAPI schema
        run: uv run python manage.py spectacular --file /tmp/openapi.yaml --validate
      - name: Validate static collection and Python syntax
        run: |
          uv run python manage.py collectstatic --noinput
          uv run python -m compileall -q .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting and lint
        run: |
          pnpm format:check
          pnpm lint
      - name: Run frontend tests
        run: pnpm test:run
      - name: Build application and Storybook
        env:
          VITE_BASE_API_URL: http://localhost:8000/api/v1
          VITE_BASE_URL: http://localhost:8000
        run: |
          pnpm build
          pnpm build-storybook

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: compose-validation-password
      SECRET_KEY: compose-validation-secret-key-with-more-than-fifty-characters
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production images
        run: docker compose build api web
      - name: Start and verify the production stack
        run: |
          docker compose up -d --wait --wait-timeout 180 db redis api celery web
          curl --fail --silent --show-error http://127.0.0.1:8000/health/live
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
          curl --fail --silent --show-error http://127.0.0.1:5173/health/live
          docker compose exec -T api python manage.py audit_data_integrity --fail-on-error
      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop validation stack
        if: always()
        run: docker compose down --volumes
